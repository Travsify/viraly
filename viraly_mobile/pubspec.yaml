name: viraly_mobile
description: "Viraly - The Open Creator Bounty & Performance Virality App for Africa"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.3
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  intl: ^0.20.2
  url_launcher: ^6.3.1
  http: ^1.3.0
  flutter_animate: ^4.5.2
  webview_flutter: ^4.7.0
  sentry_flutter: ^8.3.0
  flutter_native_splash: ^2.3.10
  image: ^4.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  min_sdk_android: 21
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#07090E"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#07090E"
  image: assets/icon/app_icon.png
  android_12:
    color: "#07090E"
    image: assets/icon/app_icon.png
  fullscreen: false

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
